name = "nearCriticalPercolation"
version = "0.1.0"
defaultTargets = ["NearCritical"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "NearCritical"
roots = ["NearCritical", "NearCritical.MainDiffusivity"]

[[lean_lib]]
name = "Percolation"
roots = ["Percolation.Literature.SharpnessDCTProofs"]
globs = ["Percolation.+"]

[[lean_lib]]
name = "OAI"
roots = ["OAI.Probability.CriticalPercolation.Exploration.SearchTree"]
globs = ["OAI.+"]

[[lean_lib]]
name = "Essakine2026Tight"
roots = ["Essakine2026Tight.Mathlib.InformationTheory.KLStoppedPrefix"]
globs = ["Essakine2026Tight.+"]

[[lean_lib]]
name = "LeanMachineLearning"
roots = ["LeanMachineLearning.ForMathlib.InformationTheory.KullbackLeibler.ChainRule"]
globs = ["LeanMachineLearning.+"]
